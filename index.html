<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Fractal Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <h1>Fractal Generator</h1>
        <div class="control">
            <label for="zoom">Zoom: <span id="zoom-val">3.0000</span></label>
            <input type="range" id="zoom" min="0.0001" max="3" step="0.0001" value="3">
        </div>
        <div class="control">
            <button id="toggle-zoom">Start Zoom</button>
        </div>
        <div class="control">
            <label for="iterations">Iterations: <span id="iterations-val">100</span></label>
            <input type="range" id="iterations" min="10" max="500" step="10" value="100">
        </div>
        <div class="control">
            <label for="color-shift">Color Shift: <span id="color-shift-val">0.0</span></label>
            <input type="range" id="color-shift" min="0" max="1" step="0.01" value="0">
        </div>
    </div>
    <canvas id="glCanvas"></canvas>
    <script src="main.js"></script>
</body>
</html>
