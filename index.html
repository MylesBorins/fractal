<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Fractal Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui">
        <div class="ui-header" id="ui-header">
            <span class="ui-title">Fractal Explorer</span>
            <a href="https://github.com/MylesBorins/fractal" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub"><img src="github.png" alt="GitHub" width="20" height="20"></a>
            <button id="toggle-ui">◀</button>
        </div>
        <div id="ui-controls">
            <!-- Fractal Type Section -->
            <div class="section">
                <div class="section-header" data-section="fractal">
                    <span>🧮 Fractal</span>
                    <button class="section-toggle">▼</button>
                </div>
                <div class="section-content" id="section-fractal">
                    <div class="control">
                        <label>Type</label>
                        <select id="fractal-type">
                            <option value="0">Mandelbrot</option>
                            <option value="1">Julia</option>
                            <option value="2">Burning Ship</option>
                            <option value="3">Tricorn</option>
                            <option value="4">Sinusoidal</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Navigation Section -->
            <div class="section">
                <div class="section-header" data-section="nav">
                    <span>🔍 Navigation</span>
                    <button class="section-toggle">▼</button>
                </div>
                <div class="section-content" id="section-nav">
                    <div class="control">
                        <label>Zoom</label>
                        <input type="range" id="zoom" min="0.000000000000000000000000000001" max="3" step="0.000000000000000000000000000001" value="3">
                    </div>
                    <div class="control">
                        <label>Auto Zoom</label>
                        <button id="toggle-zoom" class="toggle-btn">Off</button>
                    </div>
                    <div class="control">
                        <label>Zoom Speed <span id="zoom-speed-val">0.01</span></label>
                        <input type="range" id="zoom-speed" min="0.001" max="0.05" step="0.001" value="0.01">
                    </div>
                    <div class="control">
                        <button id="reset-view" class="btn-full">Reset View</button>
                    </div>
                </div>
            </div>

            <!-- Appearance Section -->
            <div class="section">
                <div class="section-header" data-section="appearance">
                    <span>🎨 Appearance</span>
                    <button class="section-toggle">▼</button>
                </div>
                <div class="section-content" id="section-appearance">
                    <div class="control">
                        <label>Color Cycle</label>
                        <button id="toggle-color-cycle" class="toggle-btn">Off</button>
                    </div>
                    <div class="control">
                        <label>Color Shift <span id="color-shift-val">0.0</span></label>
                        <input type="range" id="color-shift" min="0" max="1" step="0.01" value="0">
                    </div>
                </div>
            </div>

            <!-- Iterations Section -->
            <div class="section">
                <div class="section-header" data-section="iterations">
                    <span>⚙️ Iterations</span>
                    <button class="section-toggle">▼</button>
                </div>
                <div class="section-content" id="section-iterations">
                    <div class="control">
                        <label>Auto Iterations</label>
                        <button id="toggle-auto-iter" class="toggle-btn">On</button>
                    </div>
                    <div class="control">
                        <label>Manual <span id="iterations-val">100</span></label>
                        <input type="range" id="iterations" min="10" max="2000" step="10" value="100">
                    </div>
                    <div class="control">
                        <label>Oscillate</label>
                        <button id="toggle-iter-osc" class="toggle-btn">Off</button>
                    </div>
                    <div class="control osc-control" style="display: none;">
                        <label>Min <span id="osc-min-val">50</span></label>
                        <input type="range" id="osc-min" min="10" max="500" step="10" value="50">
                    </div>
                    <div class="control osc-control" style="display: none;">
                        <label>Max <span id="osc-max-val">1000</span></label>
                        <input type="range" id="osc-max" min="500" max="2000" step="10" value="1000">
                    </div>
                    <div class="control osc-control" style="display: none;">
                        <label>Speed <span id="osc-speed-val">0.5</span></label>
                        <input type="range" id="osc-speed" min="0.1" max="2" step="0.1" value="0.5">
                    </div>
                </div>
            </div>

            <!-- Presets Section -->
            <div class="section">
                <div class="section-header" data-section="presets">
                    <span>📍 Presets</span>
                    <button class="section-toggle">▼</button>
                </div>
                <div class="section-content" id="section-presets">
                    <div class="control">
                        <label>Interesting Points</label>
                        <select id="preset-select">
                            <option value="">-- Select Preset --</option>
                            <option data-x="-0.743643887037158" data-y="0.131825904205311" data-z="0.001">Seahorse Valley</option>
                            <option data-x="-0.1607205" data-y="1.037724" data-z="1.0">Elephant Valley</option>
                            <option data-x="-1.76" data-y="0" data-z="1.0">West Arm</option>
                            <option data-x="0.275" data-y="0.008" data-z="0.5">Mini Mandelbrot</option>
                            <option data-x="-0.745" data-y="0.12" data-z="0.001">Seahorse Variant</option>
                            <option data-x="-0.1011" data-y="0.9563" data-z="0.5">Seahorse Valley 2</option>
                            <option data-x="0.3602" data-y="0.131" data-z="0.5">Double Spiral</option>
                            <option data-x="-0.743643887037158704762" data-y="0.1318259042053119798" data-z="0.0001">Deep Seahorse</option>
                            <option data-x="-0.228144" data-y="1.192547" data-z="0.5">Triple Spiral</option>
                            <option data-x="0.275769" data-y="0.008258" data-z="0.1">Airplane Valley</option>
                        </select>
                    </div>
                </div>
            </div>



            <!-- Settings Section -->
            <div class="section">
                <div class="section-header" data-section="settings">
                    <span>🐢 Settings</span>
                    <button class="section-toggle">▼</button>
                </div>
                <div class="section-content" id="section-settings">
                    <div class="control">
                        <label>Transition Speed <span id="iter-lerp-val">0.02</span></label>
                        <input type="range" id="iter-lerp" min="0.001" max="0.2" step="0.001" value="0.02">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="ui-overlay"></div>
    <button id="mobile-toggle-fab">☰</button>
    <canvas id="glCanvas"></canvas>
    <script src="main.js"></script>
</body>
</html>
